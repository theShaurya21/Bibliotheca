spring.application.name=Bibliotheca

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/bibliotheca_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:iamspiderman}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

app.demo-data=${DEMO_DATA_ENABLED:true}
app.demo-username=${DEMO_USERNAME:librarian}
app.demo-password=${DEMO_PASSWORD:change-this-demo-password}

app.rules.maximum-active-loans=3
app.rules.loan-period-days=14
app.rules.fine-per-day=2.00
app.rules.maximum-renewals=1